services:
  tacit:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        TACIT_AGENT_CLI_PACKAGE: ${TACIT_AGENT_CLI_PACKAGE:-@openai/codex}
    ports:
      - "${TACIT_PORT:-7080}:7080"
    env_file:
      - .env
    environment:
      - TACIT_HOST=0.0.0.0
      - TACIT_PORT=7080
      - TACIT_INSTANCE=${TACIT_INSTANCE:-prod}
      - WORKSPACE_DIR=${WORKSPACE_DIR:-/workspace}
    volumes:
      - tacit-data:/home/tacit/.tacit
      - "${HOST_WORKSPACE_DIR:-./_workspace}:${WORKSPACE_DIR:-/workspace}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  tacit-data:
