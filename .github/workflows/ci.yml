name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop
        run: pnpm typecheck

      - name: Typecheck headless runtime
        run: pnpm typecheck:headless

      - name: Test security boundaries
        run: pnpm test:security

      - name: Run test suite
        run: pnpm test

      - name: Build desktop app
        run: pnpm build

