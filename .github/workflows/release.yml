name: Release (Linux and Windows)

# Mac releases are built, signed, notarized and published on a Mac with
# `pnpm release:mac --publish` (docs/releasing.md): CI has no Developer ID
# certificate, and an unsigned Mac build is refused by Gatekeeper. This
# workflow used to run on every tag and build a Mac app too; with a changelog
# entry in place it would have uploaded that unsigned app over the signed one
# with --clobber. It now builds Linux and Windows only, when started by hand
# for an existing tag, and never replaces a file already on the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, e.g. v0.40.0"
        required: true

permissions:
  contents: write

jobs:
  validate-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG.md contains version entry
        run: |
          if ! grep -q "\[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          # Extract content between this version header and the next version header (or EOF)
          awk "/^## \[${version}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release-notes.md
          echo "body<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"

    outputs:
      changelog: ${{ steps.changelog.outputs.body }}

  build:
    needs: validate-changelog
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Package with electron-builder
        run: pnpm exec electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}
          path: |
            out/*.dmg
            out/*.zip
            out/*.blockmap
            out/*.AppImage
            out/*.deb
            out/*.exe
            out/*.msi
            out/*.yml
            out/*.yaml
          if-no-files-found: ignore

  release:
    needs: [validate-changelog, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Add the Linux and Windows files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          # The release (and its Mac files) comes from release:mac; this only
          # adds to it, and fails rather than replace a file already there.
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" artifacts/*
