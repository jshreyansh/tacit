appId: com.jshreyansh.tacit
productName: Tacit
copyright: Copyright © 2026 Tacit Contributors

publish:
  provider: github
  owner: jshreyansh
  repo: tacit

directories:
  output: out
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*

extraResources:
  - from: dist-cli
    to: cli
    filter:
      - "**/*"
  - from: skills
    to: skills
    filter:
      - "**/*"
  # The MCP server every Claude terminal is handed via --mcp-config. The path
  # here must stay in step with getTermcanvasBridgeCliPath() in
  # electron/main.ts, which looks for
  # <resources>/termcanvas-bridge/termcanvas-bridge.js and returns null — no
  # error, no tools — when it is absent.
  - from: termcanvas-bridge/dist
    to: termcanvas-bridge
    filter:
      - "**/*"
  # Unpacked Chromium extension for the explicit system-browser pairing
  # prototype. It is never installed silently; the setup UI opens this exact
  # folder so the user can review and load it themselves.
  - from: browser-extension
    to: browser-extension
    filter:
      - "**/*"
asarUnpack:
  - node_modules/node-pty/**/*

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Notarization requires the hardened runtime; the hardened runtime requires
  # the exceptions in the entitlements file. See docs/releasing.md.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Skipped because the app is notarized: assessing an unstapled bundle mid-build
  # fails for the wrong reason and tells you nothing useful.
  gatekeeperAssess: false
  # Reads APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID from the
  # environment. Absent those, electron-builder skips notarizing and says so —
  # which is what a local unsigned build should do.
  notarize: true
  # No `identity` key on purpose: electron-builder finds the Developer ID
  # Application certificate in the keychain, or takes CSC_LINK/CSC_KEY_PASSWORD
  # in CI. Pinning it here would make every machine without that exact
  # certificate name fail to build at all.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  category: Development
  icon: build/icon.png
  target:
    - AppImage
    - deb

win:
  icon: build/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
